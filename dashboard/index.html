<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>KekeNow – Live Dashboard</title>
  <style>
    /* ============================================================
       Reset & base
       ============================================================ */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      background: #f4f6f3;
      color: #1a1a1a;
      min-height: 100vh;
    }

    /* ============================================================
       Header
       ============================================================ */
    header {
      background: #1b8a3a;
      color: #fff;
      padding: 16px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 8px;
    }

    header h1 { font-size: 1.5rem; font-weight: 700; letter-spacing: -0.5px; }
    header h1 span { color: #f5c518; }

    #last-updated {
      font-size: 0.85rem;
      opacity: 0.8;
    }

    /* ============================================================
       Main layout
       ============================================================ */
    main {
      padding: 24px;
      max-width: 1100px;
      margin: 0 auto;
    }

    /* ============================================================
       Summary row
       ============================================================ */
    .summary {
      display: flex;
      gap: 16px;
      margin-bottom: 24px;
      flex-wrap: wrap;
    }

    .stat-card {
      background: #fff;
      border-radius: 12px;
      padding: 16px 20px;
      flex: 1;
      min-width: 130px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.08);
    }

    .stat-card .label { font-size: 0.75rem; color: #666; margin-bottom: 4px; }
    .stat-card .value { font-size: 1.75rem; font-weight: 700; color: #1b8a3a; }

    /* ============================================================
       Table
       ============================================================ */
    .table-wrap {
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.08);
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.9rem;
    }

    thead th {
      background: #1b8a3a;
      color: #fff;
      padding: 12px 14px;
      text-align: left;
      font-weight: 600;
      white-space: nowrap;
    }

    tbody tr {
      border-bottom: 1px solid #e8ede8;
      transition: background 0.2s;
    }

    tbody tr:last-child { border-bottom: none; }
    tbody tr:hover { background: #f0f7f0; }

    tbody td {
      padding: 11px 14px;
      vertical-align: middle;
    }

    /* New-row highlight: starts yellow, fades to transparent over 5 s */
    @keyframes newRowFade {
      from { background-color: #fff3cd; }
      to   { background-color: transparent; }
    }

    tbody tr.row-new {
      animation: newRowFade 5s ease-out forwards;
    }

    /* ============================================================
       Status badges
       ============================================================ */
    .badge {
      display: inline-block;
      padding: 3px 10px;
      border-radius: 20px;
      font-size: 0.78rem;
      font-weight: 600;
      color: #fff;
      white-space: nowrap;
    }

    .badge-pending   { background: #e65100; }
    .badge-accepted  { background: #1565c0; }
    .badge-completed { background: #2e7d32; }
    .badge-declined  { background: #757575; }

    /* ============================================================
       Legend
       ============================================================ */
    .legend {
      margin-top: 16px;
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      font-size: 0.82rem;
      color: #555;
      align-items: center;
    }

    .legend-item { display: flex; align-items: center; gap: 6px; }

    /* ============================================================
       Empty / error state
       ============================================================ */
    #empty-state {
      padding: 48px;
      text-align: center;
      color: #888;
      font-size: 1.1rem;
    }
  </style>
</head>
<body>

<header>
  <h1>Keke<span>Now</span> – Live Rides</h1>
  <div id="last-updated">Last updated: —</div>
</header>

<main>

  <!-- Summary cards -->
  <div class="summary">
    <div class="stat-card">
      <div class="label">Total</div>
      <div class="value" id="stat-total">0</div>
    </div>
    <div class="stat-card">
      <div class="label">Pending</div>
      <div class="value" id="stat-pending">0</div>
    </div>
    <div class="stat-card">
      <div class="label">Accepted</div>
      <div class="value" id="stat-accepted">0</div>
    </div>
    <div class="stat-card">
      <div class="label">Completed</div>
      <div class="value" id="stat-completed">0</div>
    </div>
  </div>

  <!-- Table -->
  <div class="table-wrap">
    <table id="rides-table">
      <thead>
        <tr>
          <th>#</th>
          <th>Time (UTC)</th>
          <th>Passenger</th>
          <th>Destination</th>
          <th>Distance</th>
          <th>Fare</th>
          <th>Status</th>
        </tr>
      </thead>
      <tbody id="rides-tbody">
        <tr><td colspan="7" id="empty-state">Loading rides…</td></tr>
      </tbody>
    </table>
  </div>

  <!-- Legend -->
  <div class="legend">
    <strong>Status:</strong>
    <span class="legend-item"><span class="badge badge-pending">Pending</span> awaiting rider</span>
    <span class="legend-item"><span class="badge badge-accepted">Accepted</span> rider en-route</span>
    <span class="legend-item"><span class="badge badge-completed">Completed</span> ride done</span>
    <span class="legend-item"><span class="badge badge-declined">Declined</span> cancelled</span>
  </div>

</main>

<script>
(function () {
  'use strict';

  var knownIds = new Set();

  function formatTime(isoStr) {
    if (!isoStr) return '—';
    // Show date + time, drop milliseconds
    return isoStr.replace('T', ' ').replace(/\.\d+Z$/, ' UTC').replace('Z', ' UTC');
  }

  function truncate(str, len) {
    if (!str) return '—';
    return str.length > len ? str.slice(0, len) + '…' : str;
  }

  function statusBadge(status) {
    var cls = 'badge badge-' + (status || 'pending').toLowerCase();
    var label = (status || 'pending').charAt(0).toUpperCase() + (status || 'pending').slice(1);
    return '<span class="' + cls + '">' + label + '</span>';
  }

  function renderRides(rides) {
    var tbody = document.getElementById('rides-tbody');
    var newIds = new Set(rides.map(function (r) { return r.id; }));
    var addedIds = [];

    // Find IDs not yet rendered
    rides.forEach(function (r) {
      if (!knownIds.has(r.id)) addedIds.push(r.id);
    });

    // Rebuild table
    if (rides.length === 0) {
      tbody.innerHTML = '<tr><td colspan="7" id="empty-state">No rides yet.</td></tr>';
    } else {
      var html = '';
      rides.forEach(function (r, i) {
        var isNew = addedIds.indexOf(r.id) !== -1;
        var km = r.distanceMetres ? (r.distanceMetres / 1000).toFixed(1) + ' km' : '—';
        var fare = (r.fareMin && r.fareMax) ? '₦' + r.fareMin + ' – ₦' + r.fareMax : '—';
        var passenger = r.passengerId ? truncate(r.passengerId, 10) : '—';
        html += '<tr' + (isNew ? ' class="row-new"' : '') + '>'
          + '<td>' + (i + 1) + '</td>'
          + '<td>' + formatTime(r.createdAt) + '</td>'
          + '<td style="font-family:monospace;font-size:0.8rem">' + passenger + '</td>'
          + '<td>' + (r.destination && r.destination.name ? r.destination.name : '—') + '</td>'
          + '<td>' + km + '</td>'
          + '<td>' + fare + '</td>'
          + '<td>' + statusBadge(r.status) + '</td>'
          + '</tr>';
      });
      tbody.innerHTML = html;
    }

    knownIds = newIds;

    // Update summary stats
    document.getElementById('stat-total').textContent     = rides.length;
    document.getElementById('stat-pending').textContent   = rides.filter(function (r) { return r.status === 'pending'; }).length;
    document.getElementById('stat-accepted').textContent  = rides.filter(function (r) { return r.status === 'accepted'; }).length;
    document.getElementById('stat-completed').textContent = rides.filter(function (r) { return r.status === 'completed'; }).length;
  }

  function updateTimestamp() {
    var now = new Date();
    var h = String(now.getHours()).padStart(2, '0');
    var m = String(now.getMinutes()).padStart(2, '0');
    var s = String(now.getSeconds()).padStart(2, '0');
    document.getElementById('last-updated').textContent = 'Last updated: ' + h + ':' + m + ':' + s;
  }

  function loadRides() {
    fetch('./rides.json?_=' + Date.now())
      .then(function (res) {
        if (!res.ok) throw new Error('HTTP ' + res.status);
        return res.json();
      })
      .then(function (data) {
        // Accept either an array or { rides: [...] }
        var rides = Array.isArray(data) ? data : (data.rides || []);
        renderRides(rides);
        updateTimestamp();
      })
      .catch(function (err) {
        console.warn('KekeNow dashboard: failed to load rides.json —', err.message);
        updateTimestamp();
      });
  }

  // Initial load + 10-second auto-refresh
  loadRides();
  setInterval(loadRides, 10000);

}());
</script>
</body>
</html>
